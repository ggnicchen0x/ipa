name: Build iOS 3105 IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build/3105.xcarchive/Products/Applications -name "*.app" -maxdepth 1)
          cp -r "$APP_DIR" Payload/ByteExternal.app
          
          # Ensure executable binary is named ByteExternal
          if [ -f "Payload/ByteExternal.app/3105" ] && [ ! -f "Payload/ByteExternal.app/ByteExternal" ]; then
            mv "Payload/ByteExternal.app/3105" "Payload/ByteExternal.app/ByteExternal"
          fi
          
          # Copy standard icon files for legacy sideloaders and SpringBoard
          cp ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon*.png Payload/ByteExternal.app/ 2>/dev/null || true
          
          # Create iTunesArtwork for sideloaders from highest resolution AppIcon
          cp ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png iTunesArtwork@2x 2>/dev/null || true
          cp ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon512.png iTunesArtwork 2>/dev/null || true
          
          # Copy patch packages & skins directly into app bundle
          mkdir -p Payload/ByteExternal.app/skins
          cp -r ThreeOneOSFive/skins/* Payload/ByteExternal.app/skins/ 2>/dev/null || true
          cp -r ThreeOneOSFive/skins/* Payload/ByteExternal.app/ 2>/dev/null || true
          
          ls -la Payload/ByteExternal.app/
          
          zip -r9 ByteExternal_V1.1.3.ipa Payload/ iTunesArtwork iTunesArtwork@2x
          cp ByteExternal_V1.1.3.ipa ByteExternal.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteExternal_V1.1.3
          path: ByteExternal_V1.1.3.ipa
          retention-days: 14
