name: Build iOS 3105 IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          cp -r ./build/3105.xcarchive/Products/Applications/3105.app Payload/
          
          # Bundle all .3105 patches directly into the .app
          if [ -d "ThreeOneOSFive/BundledPatches" ]; then
            cp -r ThreeOneOSFive/BundledPatches/*.3105 Payload/3105.app/ 2>/dev/null || true
          fi
          
          zip -r9 3105_ATH_Custom.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105_ATH_Custom_IPA
          path: 3105_ATH_Custom.ipa
          retention-days: 14
