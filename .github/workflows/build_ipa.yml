name: Build iOS 3105 IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build/3105.xcarchive/Products/Applications -name "*.app" -maxdepth 1)
          cp -r "$APP_DIR" Payload/ByteExternal.app
          
          # Ensure executable binary is named ByteExternal
          if [ -f "Payload/ByteExternal.app/3105" ] && [ ! -f "Payload/ByteExternal.app/ByteExternal" ]; then
            mv "Payload/ByteExternal.app/3105" "Payload/ByteExternal.app/ByteExternal"
          fi
          
          # Copy explicit AppIcon files directly into bundle for sideloaders & SpringBoard
          cp ThreeOneOSFive/AppIcon*.png Payload/ByteExternal.app/ 2>/dev/null || true
          cp ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon*.png Payload/ByteExternal.app/ 2>/dev/null || true
          cp ThreeOneOSFive/AppLogo.png Payload/ByteExternal.app/ 2>/dev/null || true
          
          # Bundle all .3105 patches directly into the .app
          if [ -d "ThreeOneOSFive/BundledPatches" ]; then
            cp -r ThreeOneOSFive/BundledPatches/*.3105 Payload/ByteExternal.app/ 2>/dev/null || true
          fi
          
          ls -la Payload/ByteExternal.app/
          zip -r9 ByteExternal.ipa Payload/
          cp ByteExternal.ipa 3105_ATH_Custom.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteExternal_IPA
          path: ByteExternal.ipa
          retention-days: 14
