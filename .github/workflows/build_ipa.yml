name: Build iOS 3105 IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Default Xcode version:"
          xcodebuild -version || true
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build/3105.xcarchive/Products/Applications -name "*.app" -maxdepth 1)
          cp -r "$APP_DIR" Payload/ByteExternal.app

          # Ensure executable binary is named ByteExternal
          if [ -f "Payload/ByteExternal.app/3105" ] && [ ! -f "Payload/ByteExternal.app/ByteExternal" ]; then
            mv "Payload/ByteExternal.app/3105" "Payload/ByteExternal.app/ByteExternal"
          fi

          # Copy only the icons SpringBoard / legacy sideloaders actually read.
          # The full icon set still ships compiled into Assets.car; the rest
          # of the PNGs that used to clutter the bundle are redundant.
          ICONSET=ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset
          cp "$ICONSET/AppIcon60x60@2x.png" Payload/ByteExternal.app/ 2>/dev/null || true
          cp "$ICONSET/AppIcon60x60@3x.png" Payload/ByteExternal.app/ 2>/dev/null || true
          # Generic fallbacks for very old sideloaders (plain Icon.png / AppIcon.png)
          cp "$ICONSET/AppIcon60x60@2x.png" Payload/ByteExternal.app/AppIcon.png 2>/dev/null || true
          cp "$ICONSET/AppIcon60x60@2x.png" Payload/ByteExternal.app/Icon.png 2>/dev/null || true

          # iTunesArtwork lives at the .ipa root, not inside the .app bundle.
          cp "$ICONSET/AppIcon-1024.png" iTunesArtwork@2x 2>/dev/null || true
          cp "$ICONSET/AppIcon512.png" iTunesArtwork 2>/dev/null || true

          ls -la Payload/ByteExternal.app/

          zip -r9 ByteExternal_V1.1.6.ipa Payload/ iTunesArtwork iTunesArtwork@2x
          cp ByteExternal_V1.1.6.ipa ByteExternal.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteExternal_V1.1.6
          path: ByteExternal_V1.1.6.ipa
          retention-days: 14
